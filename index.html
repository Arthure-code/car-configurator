<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Car Configurator, step 1 of 3: your name, the vehicle type, its colour and the wheel size. Every field is checked before you move on.">
  <title>Basics - Car Configurator</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/styles.css">
  <script defer src="js/car.js"></script>
  <script defer src="js/validation.js"></script>
  <script defer src="js/step1.js"></script>
</head>
<body class="d-flex flex-column min-vh-100">
  <header>
    <img class="banner" src="https://images.unsplash.com/photo-1592853625511-ad0edcc69c07?auto=format&amp;fit=crop&amp;w=1600&amp;h=400&amp;q=80" alt="" width="1600" height="400" fetchpriority="high">
    <div class="container text-center pt-4">
      <h1 class="display-6">Car Configurator</h1>
      <p class="h4 fw-normal text-muted">Basics</p>
      <nav aria-label="Steps">
        <ol class="steps">
          <li class="current" aria-current="step">1. Basics</li>
          <li>2. Features</li>
          <li>3. Summary</li>
        </ol>
      </nav>
    </div>
  </header>
  <main class="container flex-grow-1 pb-5">
    <form id="step1" class="row g-3" novalidate>
      <div class="col-12 col-md-6">
        <label for="firstName" class="form-label">First name</label>
        <input type="text" class="form-control" id="firstName" name="firstName" autocomplete="given-name" required>
      </div>
      <div class="col-12 col-md-6">
        <label for="lastName" class="form-label">Last name</label>
        <input type="text" class="form-control" id="lastName" name="lastName" autocomplete="family-name" required>
      </div>
      <div class="col-12 col-md-4">
        <label for="type" class="form-label">Vehicle type</label>
        <select class="form-select" id="type" name="type" required>
          <option value="">---</option>
        </select>
      </div>
      <div class="col-12 col-md-4">
        <label for="colour" class="form-label">Colour</label>
        <select class="form-select" id="colour" name="colour" required>
          <option value="">---</option>
        </select>
      </div>
      <div class="col-12 col-md-4">
        <label for="wheels" class="form-label">Wheel size: <span id="wheelsValue">32</span> inches</label>
        <input type="range" class="form-range" id="wheels" name="wheels" min="15" max="50" value="32">
      </div>
      <div class="col-12">
        <button type="submit" class="btn btn-primary">Save and continue to step 2</button>
      </div>
    </form>
  </main>
  <footer class="border-top py-3 text-muted">
    <div class="container">&copy; 2026 - Car Configurator - <a href="LICENSE">Licence</a></div>
  </footer>
</body>
</html>
